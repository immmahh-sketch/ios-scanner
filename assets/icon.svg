<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#16213c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- document -->
  <g>
    <rect x="299" y="229" width="426" height="566" rx="28" fill="#0a0f1c" opacity="0.35"/>
    <rect x="293" y="219" width="426" height="566" rx="28" fill="url(#paper)"/>
    <g fill="#c3cede">
      <rect x="345" y="300" width="322" height="34" rx="17"/>
      <rect x="345" y="372" width="322" height="34" rx="17"/>
      <rect x="345" y="444" width="238" height="34" rx="17"/>
      <rect x="345" y="566" width="322" height="34" rx="17"/>
      <rect x="345" y="638" width="280" height="34" rx="17"/>
    </g>
  </g>

  <!-- scan beam -->
  <g filter="url(#glow)">
    <rect x="232" y="503" width="560" height="18" rx="9" fill="url(#beam)"/>
  </g>

  <!-- corner brackets (scan viewfinder) -->
  <g fill="none" stroke="#3b82f6" stroke-width="40" stroke-linecap="round">
    <path d="M250 330 V232 a24 24 0 0 1 24 -24 H372"/>
    <path d="M774 330 V232 a24 24 0 0 0 -24 -24 H652"/>
    <path d="M250 694 V792 a24 24 0 0 0 24 24 H372"/>
    <path d="M774 694 V792 a24 24 0 0 1 -24 24 H652"/>
  </g>
</svg>
